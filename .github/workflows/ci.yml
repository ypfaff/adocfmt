name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      # The image rather than the runner's shellcheck, to keep control over the
      # version used. The Alpine variant, because only it has a shell to run
      # find, which collects the scripts from the whole repository.
      - name: Lint the shell scripts
        uses: docker://koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
        with:
          entrypoint: sh
          args: -c "find . -name '*.sh' -not -path './.git/*' -exec shellcheck {} +"

      # A module of its own keeps actionlint's dependencies out of the main
      # module, which has none.
      - name: Lint the workflows
        run: go tool -modfile=tools/actionlint/go.mod actionlint

  adocfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, so that a release that formats differently arrives in its own
      # Dependabot PR. The paths leave out testdata, whose cases are meant to be
      # unformatted.
      - name: Check the formatting of the documentation
        uses: ypfaff/adocfmt@bed9e3caf659963385287458f0e15edc30f7d0c3 # v0.2.1
        with:
          args: --check README.adoc CONTRIBUTING.adoc CODE_OF_CONDUCT.adoc docs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      # The render equivalence checks shell out to Asciidoctor, and the line
      # comparison loads it through ruby; both need the version pinned in
      # internal/corpus.
      - name: Install Asciidoctor
        run: gem install asciidoctor --version "$(go run ./tools/fetch-asciidoctor-cases --print-version)" --no-document

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
