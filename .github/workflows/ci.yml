name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that the plugin is also verified against IDE releases that came
  # out since its last change.
  schedule:
    - cron: '8 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's runs share a group. Runs on main change nothing
# outside themselves, so none of them waits for another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      # Without a Go version, setup-go takes mise's Go and only adds its cache
      # of modules and builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      - name: Check that mise.toml and go.mod name the same Go
        run: |
          mise_go="$(mise current go)"
          mod_go="$(go mod edit -json | jq --raw-output '.Toolchain // .Go')"
          mod_go="${mod_go#go}"
          if [[ "${mise_go}" != "${mod_go}" ]]; then
            echo "::error::mise.toml pins Go ${mise_go}, go.mod names ${mod_go}"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none

      - name: Lint the shell scripts
        run: find . -name '*.sh' -not -path './.git/*' -exec shellcheck {} +

      # A module of its own keeps actionlint's dependencies out of the main
      # module, which has none.
      - name: Lint the workflows
        run: go tool -modfile=tools/actionlint/go.mod actionlint

      - name: Lint the TypeScript
        run: biome ci

  adocfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      - name: Check the formatting of the documentation
        run: mise run check-docs

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      # The checkout is GitHub's merge of the pull request into its base
      # branch, so its first parent is the base and its second the pull
      # request. Merge commits never land on main, whose history is linear.
      - name: Check the commit messages
        run: |
          failed=0
          commits="$(git rev-list --no-merges --reverse HEAD^1..HEAD^2)"
          for commit in ${commits}; do
            echo "Checking $(git log -1 --format='%h %s' "${commit}")"
            git log -1 --format=%B "${commit}" | go run ./tools/check-commit-message || failed=1
          done
          exit "${failed}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      # The render equivalence checks and the line comparison load Asciidoctor
      # through ruby.
      - name: Install Asciidoctor
        run: mise run install-asciidoctor

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # A pull request runs the plugin and extension jobs only when it changes what
  # they check; every other event runs them in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      plugin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.plugin == 'true' }}
      extension: ${{ github.event_name != 'pull_request' || steps.filter.outputs.extension == 'true' }}
      binary: ${{ github.event_name != 'pull_request' || steps.filter.outputs.binary == 'true' }}
    steps:
      # What the plugin and extension jobs read: their own directories, what go
      # build ./cmd/adocfmt needs, the license files the plugin bundles, and the
      # JDK and Node that mise.toml pins. A path missing here shows up in the run
      # on main, which checks everything. A change to this workflow counts as a
      # change to both, so each runs in full.
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            plugin:
              - intellij-plugin/**
              - .github/workflows/ci.yml
            extension:
              - vscode-extension/**
              - .github/workflows/ci.yml
            binary:
              - cmd/**
              - internal/**
              - go.mod
              - LICENSE
              - NOTICE
              - mise.toml
              - mise.lock

  intellij-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: intellij-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scorecard's Binary-Artifacts check accepts the committed
      # gradle-wrapper.jar only when this action validates it.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      # The tests run the adocfmt binary that the build makes with go build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      # No Gradle cache: the IDEs it would hold take most of the repository's
      # 10 GB of cache and would push out the Go caches.
      - name: Build
        run: ./gradlew build

      # Only the plugin's own code or a new IDE release can break this, and the
      # weekly run covers the new releases.
      - name: Verify the plugin
        if: needs.changes.outputs.plugin == 'true'
        run: ./gradlew verifyPlugin

  # No setup-go: the Go that mise installs builds adocfmt in seconds, and the
  # Go cache that this short job would save first lacks what the Go jobs build.
  vscode-extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      # No dependency needs an install script, so none runs.
      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Build adocfmt
        run: npm run build-adocfmt

      - name: Build and test
        run: npm test

  # goreleaser and govulncheck run only in the release and the weekly scan, so
  # an update that breaks either would pass every other check here.
  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      - name: Check the GoReleaser configuration
        run: goreleaser check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: tools/govulncheck/go.sum

      - name: Build govulncheck
        run: go build -modfile=tools/govulncheck/go.mod -o /dev/null golang.org/x/vuln/cmd/govulncheck

  # The one check of this workflow that the ruleset requires, so that a skipped
  # job does not block a pull request and a new job needs no ruleset change,
  # only an entry in needs.
  ci-status:
    if: always()
    needs: [lint, adocfmt, commit-messages, test, changes, intellij-plugin, vscode-extension, release-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
