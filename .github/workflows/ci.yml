name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that the plugin is also verified against IDE releases that came
  # out since its last change.
  schedule:
    - cron: '8 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      # The image rather than the runner's shellcheck, to keep control over the
      # version used. The Alpine variant, because only it has a shell to run
      # find, which collects the scripts from the whole repository.
      - name: Lint the shell scripts
        uses: docker://koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
        with:
          entrypoint: sh
          args: -c "find . -name '*.sh' -not -path './.git/*' -exec shellcheck {} +"

      # A module of its own keeps actionlint's dependencies out of the main
      # module, which has none.
      - name: Lint the workflows
        run: go tool -modfile=tools/actionlint/go.mod actionlint

  adocfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the formatting of the documentation
        uses: ./.github/actions/check-docs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      # The render equivalence checks and the line comparison load Asciidoctor
      # through ruby; both need the version pinned in internal/asciidoctorcases.
      - name: Install Asciidoctor
        run: gem install asciidoctor --version "$(go run ./tools/fetch-asciidoctor-cases --print-version)" --no-document

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # A pull request runs the plugin job only when it changes what that job
  # checks; every other event runs it in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      plugin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.plugin == 'true' }}
      binary: ${{ github.event_name != 'pull_request' || steps.filter.outputs.binary == 'true' }}
    steps:
      # What the plugin job reads: its own directory, what go build
      # ./cmd/adocfmt needs, and the license files it bundles. A path missing
      # here shows up in the run on main, which checks everything. A change to
      # this workflow counts as a plugin change, so it runs every step.
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            plugin:
              - intellij-plugin/**
              - .github/workflows/ci.yml
            binary:
              - cmd/**
              - internal/**
              - go.mod
              - LICENSE
              - NOTICE

  intellij-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: intellij-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scorecard's Binary-Artifacts check accepts the committed
      # gradle-wrapper.jar only when this action validates it.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # The tests run the adocfmt binary that the build makes with go build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # No Gradle cache: the IDEs it would hold take most of the repository's
      # 10 GB of cache and would push out the Go caches.
      - name: Build
        run: ./gradlew build

      # Only the plugin's own code or a new IDE release can break this, and the
      # weekly run covers the new releases.
      - name: Verify the plugin
        if: needs.changes.outputs.plugin == 'true'
        run: ./gradlew verifyPlugin

  # goreleaser and govulncheck run only in the release and the weekly scan, so
  # an update that breaks either would pass every other check here.
  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/govulncheck/go.sum

      - name: Build govulncheck
        run: go build -modfile=tools/govulncheck/go.mod -o /dev/null golang.org/x/vuln/cmd/govulncheck

  # The one check of this workflow that the ruleset requires, so that a skipped
  # job does not block a pull request and a new job needs no ruleset change,
  # only an entry in needs.
  ci-status:
    if: always()
    needs: [lint, adocfmt, test, changes, intellij-plugin, release-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
