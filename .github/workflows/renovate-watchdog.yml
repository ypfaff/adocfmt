name: Renovate watchdog

# Fails when the hosted Renovate app stops, as it once did silently for 18 days.
on:
  schedule:
    - cron: '8 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.12

      - name: Check that Renovate ran
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/check-renovate-ran
