name: Renovate watchdog

# Fails when the hosted Renovate app stops, as it once did silently for 18 days.
on:
  schedule:
    - cron: '8 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15

      - name: Check that Renovate ran
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/check-renovate-ran
