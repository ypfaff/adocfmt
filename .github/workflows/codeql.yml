name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that new CodeQL queries also check code that has not changed.
  schedule:
    - cron: '8 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's runs share a group. Runs on main change nothing
# outside themselves, so none of them waits for another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Autobuild covers the main module, the programs under tools included.
          # The external tools that the other modules under tools pin are not
          # scanned.
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
          # The IntelliJ plugin. A build would download an IDE of about 1 GB, and
          # without one CodeQL still reads every Java file.
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
