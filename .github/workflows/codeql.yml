name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that new CodeQL queries also check code that has not changed.
  schedule:
    - cron: '8 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request scans the plugin's Java only when it changes the plugin,
  # because that scan takes three minutes and blocks the merge until it ends.
  # Every other event scans everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      java: ${{ github.event_name != 'pull_request' || steps.filter.outputs.java == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            java:
              - intellij-plugin/**
              - .github/workflows/codeql.yml

  analyze:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Autobuild covers the main module, the programs under tools included.
          # The external tools that the other modules under tools pin are not
          # scanned.
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
          # The IntelliJ plugin. A build would download an IDE of about 1 GB, and
          # without one CodeQL still reads every Java file.
          - language: java-kotlin
            build-mode: none
    env:
      SCAN: ${{ matrix.language != 'java-kotlin' || needs.changes.outputs.java == 'true' }}
    steps:
      - if: env.SCAN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.SCAN == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - if: env.SCAN == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
