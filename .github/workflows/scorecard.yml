# scorecard.dev publishes the results behind the README badge only from a
# workflow that follows https://github.com/ossf/scorecard-action#workflow-restrictions.
name: Scorecard

# Scorecard rates the default branch only.
on:
  push:
    branches: [main]
  # Weekly, so that time-based checks such as Maintained stay current.
  schedule:
    - cron: '8 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Signs the results, which scorecard.dev requires before it publishes
      # them.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # The action requires a results file. Nothing reads it: the badge
          # needs only the published results, and Scorecard's findings stay out
          # of code scanning.
          results_file: results.json
          results_format: json
          publish_results: true
