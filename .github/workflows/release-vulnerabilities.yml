name: Release vulnerabilities

# The main module has no dependencies, so what can make a release vulnerable is
# the Go standard library it was built with. The scan therefore runs on the
# release's source with the release's Go version, not on main with today's.
on:
  schedule:
    - cron: '8 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/govulncheck/go.sum

      # Built now with main's Go rather than run through go tool later: the
      # release's tag has no tools/govulncheck, and its Go may be too old for
      # the tool module.
      - name: Build govulncheck
        run: go build -modfile=tools/govulncheck/go.mod -o "${RUNNER_TEMP}/govulncheck" golang.org/x/vuln/cmd/govulncheck

      # The binary records the Go version the release was built with. One build
      # made every target, so one binary speaks for all of them.
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern '*_linux_amd64.tar.gz' --output - |
            tar --extract --gzip --to-stdout adocfmt >"${RUNNER_TEMP}/adocfmt"
          go_version="$(go version "${RUNNER_TEMP}/adocfmt" | awk '{ print $2 }')"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "go-version=${go_version}" >>"${GITHUB_OUTPUT}"
          echo "### Scanning ${tag}, built with ${go_version}" >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release

      # Only the shipped command, not the tools in the main module or the tests.
      # GOTOOLCHAIN pins the standard library govulncheck checks against to the
      # release's Go. Every operating system, because advisories can be limited
      # to one; the loop goes on after a finding, so one run reports them all.
      - name: Scan the release
        env:
          GO_VERSION: ${{ steps.release.outputs.go-version }}
        run: |
          export GOTOOLCHAIN="${GO_VERSION}"
          failed=0
          for goos in linux darwin windows; do
            echo "Scanning for ${goos}"
            GOOS="${goos}" "${RUNNER_TEMP}/govulncheck" -C release ./cmd/adocfmt || failed=1
          done
          exit "${failed}"
