name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        default: minor
        options:
          - major
          - minor
          - patch
      version:
        description: Release this exact version instead, without the v
        type: string
        required: false

run-name: Release ${{ inputs.version || inputs.bump }} by @${{ github.actor }}

permissions:
  contents: read

# Two releases at once would race for the tag and the formula commit, and
# cancelling one halfway would leave a tag without a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commits to the branch it runs on and tags that branch's head.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      # Signs the build provenance and stores it with the repository.
      id-token: write
      attestations: write
    steps:
      # The rulesets on main and the version tags can list this app as a bypass
      # actor, but not GITHUB_TOKEN.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout stores this token for the git pushes further down.
          token: ${{ steps.app-token.outputs.token }}
          # The whole history, because the version comes from the tags and the
          # changelog from the commits since the last one.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Determine the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${VERSION}" ]]; then
            version="$(go run ./tools/calculate-version --explicit "${VERSION}")"
          else
            version="$(go run ./tools/calculate-version --bump "${BUMP}")"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "### Releasing v${version}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Configure the release commit identity
        run: |
          git config user.name "adocfmt-release[bot]"
          git config user.email "336435079+adocfmt-release[bot]@users.noreply.github.com"

      # Before the tag, because uses: ypfaff/adocfmt@vX.Y.Z resolves action.yml
      # off the tagged commit: writing the default after tagging would tag a
      # commit that still names the previous release.
      - name: Set the action's default version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./tools/set-action-version --version "${VERSION}" --file action.yml
          git add action.yml
          # A retry of the same version finds the default already committed.
          git diff --cached --quiet ||
            git commit --message "chore(action): default to v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # GoReleaser reads the version off the tag, so the tag comes first. Pushing
      # it here rather than letting the release create it keeps the tag on the
      # commit that was built, and go install serves the version right away. The
      # price: a release that fails afterwards leaves the tag behind, and the next
      # attempt needs the tag deleted or the next version.
      - name: Tag the release
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag --annotate "v${VERSION}" --message "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      # Creates the release as a draft; .goreleaser.yml says why.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-checksums: dist/checksums.txt

      # Scorecard's Signed-Releases check looks for the .intoto.jsonl name.
      # Publishing comes before the formula and the major tag, which both send
      # users to the release's downloads.
      - name: Attach the provenance and publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          provenance="dist/adocfmt_${VERSION}.intoto.jsonl"
          cp "${BUNDLE}" "${provenance}"
          gh attestation verify "dist/adocfmt_${VERSION}_linux_amd64.tar.gz" \
            --bundle "${provenance}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh release upload "v${VERSION}" "${provenance}"
          gh release edit "v${VERSION}" --draft=false --latest

      # After the release, because the checksums it writes into the formula exist
      # only once the archives are built.
      - name: Update the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./tools/generate-formula \
            --version "${VERSION}" \
            --checksums dist/checksums.txt \
            --output HomebrewFormula/adocfmt.rb
          git add HomebrewFormula/adocfmt.rb
          git commit --message "chore(homebrew): update the formula to v${VERSION}"
          # The branch may have moved on while GoReleaser ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Points at the tagged commit's SHA, not at HEAD: HEAD has since moved on
      # with the Homebrew formula commit, which the moving tag has no reason to
      # follow.
      #
      # Seconds after GoReleaser published v0.2.0, GitHub rejected this push with
      # a bare "failed", although the ruleset let it through; the same update
      # went through minutes later. Hence the retries.
      - name: Move the major version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          major="v${VERSION%%.*}"
          git tag --force --annotate "${major}" "${SHA}" --message "Release v${VERSION}"
          for attempt in 1 2 3 4; do
            git push --force origin "refs/tags/${major}" && exit 0
            echo "::warning::Push of ${major} failed on attempt ${attempt}, retrying in 10 seconds"
            sleep 10
          done
          git push --force origin "refs/tags/${major}"
