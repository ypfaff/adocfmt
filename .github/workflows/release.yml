name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        default: minor
        options:
          - major
          - minor
          - patch
      version:
        description: Release this exact version instead, without the v
        type: string
        required: false

run-name: Release ${{ inputs.version || inputs.bump }} by @${{ github.actor }}

permissions:
  contents: read

# Two releases at once would race for the tag and the formula commit, and
# cancelling one halfway would leave a tag without a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commits to the branch it runs on and tags that branch's head.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      # Signs the build provenance and stores it with the repository.
      id-token: write
      attestations: write
    steps:
      # The rulesets on main and the version tags can list this app as a bypass
      # actor, but not GITHUB_TOKEN.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout stores this token for the git pushes further down.
          token: ${{ steps.app-token.outputs.token }}
          # The whole history, because the version comes from the tags and the
          # changelog from the commits since the last one.
          fetch-depth: 0

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.14

      # Without a Go version, setup-go takes mise's Go and only adds its cache
      # of modules and builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      - name: Determine the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${VERSION}" ]]; then
            version="$(go run ./tools/calculate-version --explicit "${VERSION}")"
          else
            version="$(go run ./tools/calculate-version --bump "${BUMP}")"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "### Releasing v${version}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Configure the release commit identity
        run: |
          git config user.name "adocfmt-release[bot]"
          git config user.email "336435079+adocfmt-release[bot]@users.noreply.github.com"

      # Before the tag, because uses: ypfaff/adocfmt@vX.Y.Z resolves action.yml
      # off the tagged commit: writing the default after tagging would tag a
      # commit that still names the previous release.
      - name: Set the action's default version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./tools/set-action-version --version "${VERSION}" --file action.yml
          git add action.yml
          # A retry of the same version finds the default already committed.
          git diff --cached --quiet ||
            git commit --message "chore(action): default to v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # GoReleaser reads the version off the tag, so the tag comes first. Pushing
      # it here rather than letting the release create it keeps the tag on the
      # commit that was built, and go install serves the version right away. The
      # price: a release that fails afterwards leaves the tag behind, and the next
      # attempt needs the tag deleted or the next version.
      - name: Tag the release
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag --annotate "v${VERSION}" --message "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      # Creates the release as a draft; .goreleaser.yml says why.
      - name: Release with GoReleaser
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
        run: goreleaser release --clean

      # The plugin carries the binaries GoReleaser just built. Without the
      # secrets, Gradle skips the signing, and the copy fails on the missing zip.
      - name: Build and sign the IntelliJ plugin
        working-directory: intellij-plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INTELLIJ_CERTIFICATE_CHAIN: ${{ secrets.INTELLIJ_CERTIFICATE_CHAIN }}
          INTELLIJ_PRIVATE_KEY: ${{ secrets.INTELLIJ_PRIVATE_KEY }}
          INTELLIJ_PRIVATE_KEY_PASSWORD: ${{ secrets.INTELLIJ_PRIVATE_KEY_PASSWORD }}
        run: |
          ./gradlew signPlugin -PpluginVersion="${VERSION}" -PgoreleaserDist=../dist
          cp "build/distributions/adocfmt-intellij-plugin-${VERSION}-signed.zip" \
            "../dist/adocfmt_${VERSION}_intellij-plugin.zip"

      # One provenance for every archive and the plugin. It names the commit
      # the run started on, not the tagged one the run commits on top, because
      # the signing certificate takes the commit from the run. The tagged commit
      # changes only action.yml, which no archive contains.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # Scorecard's Signed-Releases check looks for the .intoto.jsonl name.
      # Publishing comes before the formula and the major tag, which both send
      # users to the release's downloads.
      - name: Attach the provenance and publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          provenance="dist/adocfmt_${VERSION}.intoto.jsonl"
          plugin="dist/adocfmt_${VERSION}_intellij-plugin.zip"
          cp "${BUNDLE}" "${provenance}"
          # One archive is enough to check the signature they all share; the
          # plugin comes from a pattern of its own.
          for subject in "dist/adocfmt_${VERSION}_linux_amd64.tar.gz" "${plugin}"; do
            gh attestation verify "${subject}" \
              --bundle "${provenance}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done
          gh release upload "v${VERSION}" "${provenance}" "${plugin}"
          gh release edit "v${VERSION}" --draft=false --latest

      # After the release, because the checksums it writes into the formula exist
      # only once the archives are built.
      - name: Update the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run ./tools/generate-formula \
            --version "${VERSION}" \
            --checksums dist/checksums.txt \
            --output HomebrewFormula/adocfmt.rb
          git add HomebrewFormula/adocfmt.rb
          git commit --message "chore(homebrew): update the formula to v${VERSION}"
          # The branch may have moved on while GoReleaser ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Points at the tagged commit's SHA, not at HEAD: HEAD has since moved on
      # with the Homebrew formula commit, which the moving tag has no reason to
      # follow.
      #
      # Seconds after GoReleaser published v0.2.0, GitHub rejected this push with
      # a bare "failed", although the ruleset let it through; the same update
      # went through minutes later. Hence the retries.
      - name: Move the major version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          major="v${VERSION%%.*}"
          git tag --force --annotate "${major}" "${SHA}" --message "Release v${VERSION}"
          for attempt in 1 2 3 4; do
            git push --force origin "refs/tags/${major}" && exit 0
            echo "::warning::Push of ${major} failed on attempt ${attempt}, retrying in 10 seconds"
            sleep 10
          done
          git push --force origin "refs/tags/${major}"

      # Moves the pin in mise.toml to this release, but only when the release
      # finds the docs formatted. If it does not, the pin stays, and Renovate
      # opens a PR where the docs get reformatted.
      - name: Pin the release in mise.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: mise use "github:ypfaff/adocfmt@${VERSION}"

      - name: Check the documentation with the release
        id: check-docs
        continue-on-error: true
        run: mise run check-docs

      - name: Push the pin
        if: steps.check-docs.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add mise.toml mise.lock
          # A retry of the same version finds the pin already committed.
          git diff --cached --quiet ||
            git commit --message "chore(deps): update dependency github:ypfaff/adocfmt to v${VERSION}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Leave the pin to Renovate
        if: steps.check-docs.outcome == 'failure'
        run: echo "::warning::The documentation check with the release failed; Renovate proposes the pin in a PR"

      # The action as users run it, without a version: its default names this
      # release since the step that set it above.
      - name: Test the released action
        uses: ./
        with:
          args: --version
