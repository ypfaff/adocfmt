version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
      # Its own releases need no waiting period.
      exclude: ["ypfaff/adocfmt"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Majors stay out: they tend to change an action's inputs, which needs a
      # workflow change and a review of its own.
      actions:
        patterns: ["*"]
        # Out of the group while adocfmt is at 0.x, where a minor can break like
        # a major: its own PR takes the reformatted docs. From 1.0 it can rejoin.
        exclude-patterns: ["ypfaff/adocfmt"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      modules:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /tools/actionlint
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
    # Go marks a tool as indirect, and the default covers direct dependencies
    # only, which would leave actionlint itself unwatched. Naming it keeps its
    # own dependencies at the versions its release was tested with.
    allow:
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /tools/hugo
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
    # As for actionlint: naming Hugo keeps the tool itself watched.
    allow:
      - dependency-name: github.com/gohugoio/hugo
        dependency-type: all
    commit-message:
      prefix: chore
      include: scope

  # The website's tools, which tools/build-website takes from the lockfile.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directory: /tools/htmltest
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
    # Unlike for actionlint, every dependency stays current, not only the tool:
    # htmltest's last release, from 2022, pins a golang.org/x/net with known
    # vulnerabilities.
    allow:
      - dependency-type: all
    ignore:
      # v1 moved to dario.cat/mergo, but htmltest imports the old path.
      - dependency-name: github.com/imdario/mergo
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /tools/govulncheck
    schedule:
      interval: weekly
      day: monday
      time: "16:08"
    cooldown:
      default-days: 7
    # As for actionlint: naming govulncheck keeps the tool itself watched.
    allow:
      - dependency-name: golang.org/x/vuln
        dependency-type: all
    commit-message:
      prefix: ci
      include: scope
