version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

  enable:
    - errorlint # correct error wrapping (%w, errors.Is)
    - misspell  # typos in comments and strings
    - revive    # style and convention checks (successor to golint)

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra:
        group-params: true    # replaces gocritic paramTypeCombine
        clothe-returns: true  # no naked returns, replaces nakedret
    golines:
      max-len: 120
