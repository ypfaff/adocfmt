<!doctype html>
<html lang="{{ site.Language.Locale }}" data-pf-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ partial "search.html" . }}
  {{ $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
