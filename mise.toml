[tools]
"github:ypfaff/adocfmt" = "0.7.0"
# The same as the toolchain line in go.mod; see the go rule in
# .github/renovate.json5.
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.18.3"
java = "temurin-21.0.13+9.0.LTS"
lefthook = "2.2.2"
ruby = "4.0.7"
shellcheck = "0.11.0"

[tasks.check-docs]
description = "Check the formatting of the documentation"
# The cases under testdata are meant to be unformatted.
run = "adocfmt --check README.adoc CONTRIBUTING.adoc CODE_OF_CONDUCT.adoc docs"

[tasks.install-asciidoctor]
description = "Install the Asciidoctor gem that the tests run with"
# internal/asciidoctorcases pins the version. The lookup has its own line, so
# that its failure stops the task instead of installing the latest gem.
run = '''
version="$(go run ./tools/fetch-asciidoctor-cases --print-version)"
gem install asciidoctor --version "${version}" --no-document
'''

[tasks.setup]
description = "Install the Asciidoctor gem and the Git hooks"
depends = ["install-asciidoctor"]
run = "lefthook install"
