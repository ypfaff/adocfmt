# Install with: lefthook install

pre-commit:
  jobs:
    - name: lint
      run: golangci-lint run

    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: go tool -modfile=tools/actionlint/go.mod actionlint

    # The cases under testdata are meant to be unformatted.
    - name: adocfmt
      glob: "*.{adoc,asciidoc}"
      exclude:
        - "testdata/**"
      run: adocfmt --check {staged_files}

pre-push:
  jobs:
    - name: test
      run: go test ./...
