# Install with: mise run setup

# Starts lefthook through mise, so that the jobs find the tools mise.toml
# pins even when a Git GUI runs the hooks outside an activated shell.
lefthook: mise exec -- lefthook

pre-commit:
  jobs:
    - name: lint
      run: golangci-lint run

    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}

    - name: google-java-format
      glob: "intellij-plugin/**/*.java"
      run: intellij-plugin/gradlew --project-dir intellij-plugin --quiet spotlessCheck

    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: go tool -modfile=tools/actionlint/go.mod actionlint

    # The cases under testdata are meant to be unformatted.
    - name: adocfmt
      glob: "*.{adoc,asciidoc}"
      exclude:
        - "testdata/**"
      run: adocfmt --check {staged_files}

commit-msg:
  # Merge commits never land on main, whose history is linear.
  skip:
    - merge
  jobs:
    - name: conventional-commits
      run: go run ./tools/check-commit-message < {1}

pre-push:
  jobs:
    - name: test
      run: go test ./...
